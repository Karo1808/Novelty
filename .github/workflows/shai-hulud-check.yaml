name: Shai-Hulud 2.0 Security Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gensecaihq/Shai-Hulud-2.0-Detector@v1
        with:
          fail-on-critical: true      # fail build if Shai-Hulud indicators found
          scan-lockfiles: true        # scan package-lock/pnpm-lock/yarn.lock
          scan-node-modules: false    # turn on if you want deep node_modules scan
