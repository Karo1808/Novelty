services:
  prometheus:
    network_mode: "host"
    ports:
      - "${PROMETHEUS_PORT}:${PROMETHEUS_PORT}"
  
  loki:
      network_mode: "host"
      ports:
      - "${LOKI_PORT}:${LOKI_PORT}"

  promtail:
    network_mode: "host"
    ports:
    - "${PROMTAIL_PORT}:${PROMTAIL_PORT}"

  grafana:
    network_mode: "host"
    ports:
      - "${GRAFANA_PORT}:${GRAFANA_PORT}"

