scrape_configs:
  - job_name: novelty
    static_configs:
      - targets: ["localhost:3001"]
    scrape_interval: 10s

  - job_name: node
    static_configs:
      - targets: ["localhost:9100"]

  - job_name: postgres
    static_configs:
    - targets: ["localhost:9187"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '.*_nan$'
        action: drop


rule_files:
  - /etc/prometheus/alert.rules.yml
