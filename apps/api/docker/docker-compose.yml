services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ../monitoring/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml
      - ../monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml
    restart: always

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ../monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml

  promtail:
      image: grafana/promtail:3.0.0
      container_name: promtail
      volumes:
        - ../monitoring/promtail/promtail-config.yaml:/etc/promtail/promtail.yaml
      command: -config.file=/etc/promtail/promtail.yaml
      depends_on:
        - loki

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: always

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: always
    command:
      - '--collector.systemd'
      - '--collector.processes'

volumes:
  grafana_data:
    driver: local
